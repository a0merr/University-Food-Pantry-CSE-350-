<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff | Campus Food Pantry</title><link rel="stylesheet" href="/css/styles.css"></head><body><a class="skip" href="#main">Skip to content</a><header><h1>Pantry staff dashboard</h1><button id="logout" type="button">Sign out</button></header><main id="main"><div id="message" role="status"></div><section class="panel"><h2>Pickup queue</h2><div id="requests"></div></section><section class="panel"><h2>Inventory</h2><div id="inventory"></div><h3>Add item</h3><form id="addItem"><label>Name<input name="name" required></label><label>Category<input name="category" required></label><label>Quantity<input name="quantity" type="number" min="0" value="10" required></label><button>Add item</button></form></section><section class="panel"><h2>Log donation</h2><form id="donation"><label>Item <select name="item_id" id="donationItem"></select></label><label>Quantity<input name="quantity" type="number" min="1" value="1" required></label><button>Log donation</button></form></section><section class="panel"><h2>Pickup slots</h2><form id="addSlot"><label>Local date and time<input name="starts_at" type="datetime-local" required></label><label>Capacity<input name="capacity" type="number" min="1" value="4" required></label><button>Add slot</button></form><div id="slots"></div></section><section class="panel"><h2>Low-stock alerts</h2><div id="alerts"></div></section><section class="panel"><h2>Visit limit</h2><form id="visitLimit"><label>Maximum items<input name="visit_item_limit" id="limit" type="number" min="1" max="100" required></label><button>Save limit</button></form></section><section class="panel"><h2>Usage report</h2><form id="reportForm"><label>From (optional)<input name="from" type="datetime-local"></label><label>To (optional)<input name="to" type="datetime-local"></label><button>Show report</button></form><div id="report" aria-live="polite"></div></section></main><script src="/js/staff.js"></script></body></html>
