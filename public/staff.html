<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff | Campus Food Pantry</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>Staff Pickup Desk</h1>
    <nav aria-label="Account"><a href="/" id="sign-out">Sign out</a></nav>
  </header>
  <main>
    <section aria-labelledby="queue-title">
      <div class="toolbar">
        <h2 id="queue-title">Pickup Queue</h2>
        <label>Status
          <select id="queue-status">
            <option value="">Open</option>
            <option value="scheduled">Scheduled</option>
            <option value="prepared">Prepared</option>
          </select>
        </label>
        <button id="refresh-queue" type="button" class="secondary">Refresh</button>
      </div>
      <div id="queue-message" aria-live="polite"></div>
      <div id="pickup-queue"></div>
    </section>

    <section aria-labelledby="slots-title">
      <h2 id="slots-title">Pickup Slots</h2>
      <form id="slot-form">
        <label>Start time
          <input id="slot-starts-at" name="starts_at" type="datetime-local" required>
        </label>
        <label>Capacity
          <input id="slot-capacity" name="capacity" type="number" min="1" max="100" value="4" required>
        </label>
        <button type="submit">Add Slot</button>
      </form>
      <div id="slot-message" aria-live="polite"></div>
      <div id="slot-list"></div>
    </section>

    <section aria-labelledby="alerts-title">
      <div class="toolbar">
        <h2 id="alerts-title">Low Stock Alerts</h2>
        <button id="check-alerts" type="button" class="secondary">Check Stock</button>
      </div>
      <div id="alert-message" aria-live="polite"></div>
      <div id="alert-list"></div>
    </section>

    <section aria-labelledby="reports-title">
      <h2 id="reports-title">Reports</h2>
      <form id="reports-form">
        <label>From
          <input name="from" type="date">
        </label>
        <label>To
          <input name="to" type="date">
        </label>
        <button type="submit">Run Report</button>
      </form>
      <div id="reports-message" aria-live="polite"></div>
      <div id="reports-summary"></div>
      <h3>Pickup Statuses</h3>
      <div id="reports-statuses"></div>
      <h3>Top Items</h3>
      <div id="reports-top-items"></div>
      <h3>Inventory by Category</h3>
      <div id="reports-categories"></div>
    </section>
  </main>
  <script type="module" src="/js/staff-pickups.js"></script>
  <script type="module" src="/js/staff-reports.js"></script>
  <script type="module" src="/js/signout.js"></script>
</body>
</html>
