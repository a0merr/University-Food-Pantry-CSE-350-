<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff | Campus Food Pantry</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f9fb;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #5b6876;
      --line: #d8e0e8;
      --accent: #237c70;
      --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: #15343f;
      color: #fff;
      padding: 18px clamp(16px, 4vw, 42px);
    }
    header h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2rem); }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 48px;
      display: grid;
      gap: 22px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }
    form, .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-bottom: 14px;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: .9rem;
    }
    input, select, button {
      min-height: 40px;
      border-radius: 6px;
      border: 1px solid var(--line);
      padding: 8px 10px;
      font: inherit;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }
    button.secondary {
      background: #eef4f3;
      color: var(--accent);
    }
    button.danger {
      background: var(--danger);
      border-color: var(--danger);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border-top: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-size: .86rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 6px;
      background: #eaf7f4;
      color: #155c53;
      margin-bottom: 12px;
    }
    .message.error {
      background: #fdecec;
      color: var(--danger);
    }
    .empty {
      color: var(--muted);
      padding: 12px 0;
    }
    @media (max-width: 760px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr { border-top: 1px solid var(--line); padding: 10px 0; }
      td { border: 0; padding: 5px 0; }
      td::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: .78rem;
        font-weight: 700;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Staff Pickup Desk</h1>
  </header>
  <main>
    <section aria-labelledby="queue-title">
      <div class="toolbar">
        <h2 id="queue-title">Pickup Queue</h2>
        <label>Status
          <select id="queue-status">
            <option value="">Open</option>
            <option value="scheduled">Scheduled</option>
            <option value="prepared">Prepared</option>
          </select>
        </label>
        <button id="refresh-queue" type="button" class="secondary">Refresh</button>
      </div>
      <div id="queue-message" aria-live="polite"></div>
      <div id="pickup-queue"></div>
    </section>

    <section aria-labelledby="slots-title">
      <h2 id="slots-title">Pickup Slots</h2>
      <form id="slot-form">
        <label>Start time
          <input id="slot-starts-at" name="starts_at" type="datetime-local" required>
        </label>
        <label>Capacity
          <input id="slot-capacity" name="capacity" type="number" min="1" max="100" value="4" required>
        </label>
        <button type="submit">Add Slot</button>
      </form>
      <div id="slot-message" aria-live="polite"></div>
      <div id="slot-list"></div>
    </section>

    <section aria-labelledby="alerts-title">
      <div class="toolbar">
        <h2 id="alerts-title">Low Stock Alerts</h2>
        <button id="check-alerts" type="button" class="secondary">Check Stock</button>
      </div>
      <div id="alert-message" aria-live="polite"></div>
      <div id="alert-list"></div>
    </section>

    <section aria-labelledby="reports-title">
      <h2 id="reports-title">Reports</h2>
      <form id="reports-form">
        <label>From
          <input name="from" type="date">
        </label>
        <label>To
          <input name="to" type="date">
        </label>
        <button type="submit">Run Report</button>
      </form>
      <div id="reports-message" aria-live="polite"></div>
      <div id="reports-summary"></div>
      <h3>Pickup Statuses</h3>
      <div id="reports-statuses"></div>
      <h3>Top Items</h3>
      <div id="reports-top-items"></div>
      <h3>Inventory by Category</h3>
      <div id="reports-categories"></div>
    </section>
  </main>
  <script type="module" src="/js/staff-pickups.js"></script>
  <script type="module" src="/js/staff-reports.js"></script>
</body>
</html>
