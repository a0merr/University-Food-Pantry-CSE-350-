<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff | Campus Food Pantry</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>Staff Pickup Desk</h1>
    <nav aria-label="Account"><a href="/" id="sign-out">Sign out</a></nav>
  </header>
  <main>
    <section aria-labelledby="queue-title">
      <div class="toolbar">
        <h2 id="queue-title">Pickup Queue</h2>
        <label>Status
          <select id="queue-status">
            <option value="">Open</option>
            <option value="scheduled">Scheduled</option>
            <option value="prepared">Prepared</option>
          </select>
        </label>
        <button id="refresh-queue" type="button" class="secondary">Refresh</button>
      </div>
      <div id="queue-message" aria-live="polite"></div>
      <div id="pickup-queue"></div>
    </section>

    <section aria-labelledby="slots-title">
      <h2 id="slots-title">Pickup Slots</h2>
      <form id="slot-form">
        <label>Start time
          <input id="slot-starts-at" name="starts_at" type="datetime-local" required>
        </label>
        <label>Capacity
          <input id="slot-capacity" name="capacity" type="number" min="1" max="100" value="4" required>
        </label>
        <button type="submit">Add Slot</button>
      </form>
      <div id="slot-message" aria-live="polite"></div>
      <div id="slot-list"></div>
    </section>

    <section aria-labelledby="alerts-title">
      <div class="toolbar">
        <h2 id="alerts-title">Low Stock Alerts</h2>
        <button id="check-alerts" type="button" class="secondary">Check Stock</button>
      </div>
      <div id="alert-message" aria-live="polite"></div>
      <div id="alert-list"></div>
    </section>

    <section aria-labelledby="inventory-title">
      <h2 id="inventory-title">Inventory</h2>
      <h3 id="item-form-title">Add an item</h3>
      <form id="item-form" aria-labelledby="item-form-title">
        <label>Name
          <input id="item-name" name="name" maxlength="100" required>
        </label>
        <label>Category
          <input id="item-category" name="category" maxlength="100" required>
        </label>
        <label>On shelf
          <input id="item-quantity" name="quantity" type="number" min="0" max="100000" value="0" required>
        </label>
        <label>Low-stock threshold
          <input id="item-threshold" name="low_stock_threshold" type="number" min="0" max="100000" value="5" required>
        </label>
        <label>Per-visit limit
          <input id="item-limit" name="per_visit_limit" type="number" min="1" max="100" placeholder="No limit">
        </label>
        <label>Dietary tags
          <input id="item-tags" name="dietary_tags" maxlength="200" placeholder="vegan, gluten-free">
        </label>
        <button id="item-submit" type="submit">Add Item</button>
        <button id="item-cancel-edit" type="button" class="secondary" hidden>Cancel Edit</button>
      </form>
      <div id="item-message" aria-live="polite"></div>
      <h3 id="donation-form-title">Log a donation</h3>
      <form id="donation-form" aria-labelledby="donation-form-title">
        <label>Item
          <select id="donation-item" name="item_id" required></select>
        </label>
        <label>Quantity donated
          <input id="donation-quantity" name="quantity" type="number" min="1" max="100000" required>
        </label>
        <label>Source (optional)
          <input id="donation-source" name="source" maxlength="100" placeholder="Campus food drive">
        </label>
        <button type="submit">Log Donation</button>
      </form>
      <div id="donation-message" aria-live="polite"></div>
      <h3>Items</h3>
      <div id="item-list"></div>
    </section>

    <section aria-labelledby="reports-title">
      <h2 id="reports-title">Reports</h2>
      <form id="reports-form">
        <label>From
          <input name="from" type="date">
        </label>
        <label>To
          <input name="to" type="date">
        </label>
        <button type="submit">Run Report</button>
      </form>
      <div id="reports-message" aria-live="polite"></div>
      <div id="reports-summary"></div>
      <h3>Pickup Statuses</h3>
      <div id="reports-statuses"></div>
      <h3>Top Items</h3>
      <div id="reports-top-items"></div>
      <h3>Inventory by Category</h3>
      <div id="reports-categories"></div>
    </section>
  </main>
  <script type="module" src="/js/staff-pickups.js"></script>
  <script type="module" src="/js/staff-reports.js"></script>
  <script type="module" src="/js/staff-inventory.js"></script>
  <script type="module" src="/js/signout.js"></script>
  <script type="module" src="/js/staff-guard.js"></script>
</body>
</html>
